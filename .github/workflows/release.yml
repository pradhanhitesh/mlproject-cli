name: Build and Release

on:
  push:
    branches:
      - main   # only trigger on main branch

permissions:
  contents: write
  
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # required to fetch tags

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install bump2version & build tools
        run: |
          python -m pip install --upgrade pip
          pip install bump2version build wheel

      - name: Configure git user
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Get latest tag
        id: get_tag
        run: |
          git fetch --tags
          latest_tag=$(git describe --tags --abbrev=0 || echo "v0.0.0")
          echo "latest_tag=$latest_tag" >> $GITHUB_ENV

      - name: Determine bump type   # ✅ fixed indentation
        id: bump_type
        run: |
          if [[ "${{ github.event.head_commit.message }}" == *"bump: major"* ]]; then
            echo "bump_type=major" >> $GITHUB_ENV
          elif [[ "${{ github.event.head_commit.message }}" == *"bump: minor"* ]]; then
            echo "bump_type=minor" >> $GITHUB_ENV
          elif [[ "${{ github.event.head_commit.message }}" == *"bump: patch"* ]]; then
            echo "bump_type=patch" >> $GITHUB_ENV
          else
            echo "❌ ERROR: Commit must include 'bump: patch|minor|major'"
            exit 1
          fi

      - name: Bump version
        run: |
          bump2version --current-version ${latest_tag#v} $bump_type --tag --commit --allow-dirty
        env:
          bump_type: ${{ env.bump_type }}
          latest_tag: ${{ env.latest_tag }}

      - name: Push new version and tag
        run: |
          git push origin HEAD:main --tags

      - name: Build package
        run: python -m build

      - name: Upload release assets
        uses: softprops/action-gh-release@v1
        with:
          name: "MLProject CLI ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*.whl
            dist/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
